<div class="container-fluid d-block mt-5 px-0">

          <div class="col-1 p-0">

              <button class="carousel-control-prev m-auto" type="button" data-bs-target="#offerCarousel"

              </button>

          </div>

          <div class="col-10 d-flex justify-content-center px-0">
              <div class="carousel-inner">

                  <div class="carousel-item active d-block">

                          <div class="col-4">
                              <div class="card">

                                  src="https://web.archive.org/web/20240313111837im_/https://cdn.akamai.steamstatic.com/steam/spotlights/222fcf1735e29bb17fe04e02/spotlight_image_english.jpg?t=1709744833">

                                  <div class="container text"> 
                                    
                                  </div>
                              </div>
                          </div>


                          <div class="col-4">
                            <div class="card">
                                <img class="img" 
                                src="https://web.archive.org/web/20240313111837im_/https://cdn.akamai.steamstatic.com/steam/spotlights/222fcf1735e29bb17fe04e02/spotlight_image_english.jpg?t=1709744833">

                                <div class="container text"> 
                                  
                                </div>
                            </div>
                        </div>


                        <div class="col-4">
                          <div class="card">
                              <img class="img"

                              <div class="container text"> 
                                
                              </div>
                          </div>
                      </div>

                      </div>
                  </div>
              </div>
          </div>

          <div class="col-1 p-0">

              <button class="carousel-control-next align-items-center m-auto" type="button"
                  data-bs-target="#offerCarousel" data-bs-slide="next">
                  <span class="carousel-control-next-icon" aria-hidden="true"></span>
                  <span class="visually-hidden">Next</span>
              </button>

          </div>

      </div>
      <div class="row">

          <div class="col">

              <div class="carousel-indicators pt-3">
                  <button type="button" data-bs-target="#offerCarousel" data-bs-slide-to="0" class="active"
                      aria-label="Slide 1"></button>
                  <button type="button" data-bs-target="#offerCarousel" data-bs-slide-to="1"

                  <button type="button" data-bs-target="#offerCarousel" data-bs-slide-to="2"
                      aria-label="Slide 3"></button>

          </div>
