<div class="container-fluid p-0 pt-5 d-block">

  <div id="myCarousel" class="carousel slide carousel-fade main" data-bs-ride="carousel">
    <div class="row">
      <div class="col-1">

        <button class="carousel-control-prev m-auto" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>

      </div>
      <div class="col-10">
        <div class="row">
          <div class="container p-0">
            <div class="carousel-inner justify-content-center">
              <div class="carousel-item active h-50">
                <div class="row">

                  <div class="col-4 p-0 d-flex justify-content-center">
                    <div class="card px-1" type="button" style="background-image: url('https://web.archive.org/web/20240313111837im_/https://cdn.akamai.steamstatic.com/steam/spotlights/222fcf1735e29bb17fe04e02/spotlight_image_english.jpg?t=1709744833');">
                    <!--   <img
                        src="https://web.archive.org/web/20240313111837im_/https://cdn.akamai.steamstatic.com/steam/spotlights/222fcf1735e29bb17fe04e02/spotlight_image_english.jpg?t=1709744833"
                        type="button" alt="photo 2" class="cardImages"> -->
                        <div class="card-body d-flex align-items-end">
                        </div>
                    </div>
                    
                  </div>

                  <div class="col-4 p-0 d-flex justify-content-center">
                    <div class="card px-1" type="button">
                      <img
                        src="https://web.archive.org/web/20240313111837im_/https://cdn.akamai.steamstatic.com/steam/spotlights/222fcf1735e29bb17fe04e02/spotlight_image_english.jpg?t=1709744833"
                        type="button" alt="photo 2" class="cardImages">
                    </div>
                  </div>

                  <div class="col-4 p-0 d-flex justify-content-center">
                    <div class="card px-1" type="button">
                      <img
                        src="https://web.archive.org/web/20240313111837im_/https://cdn.akamai.steamstatic.com/steam/spotlights/222fcf1735e29bb17fe04e02/spotlight_image_english.jpg?t=1709744833"
                        type="button" alt="photo 2" class="cardImages">
                    </div>
                  </div>

                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col-1">

        <button class="carousel-control-next align-items-center m-auto" type="button" data-bs-target="#myCarousel"
          data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>

        <div class="carousel-indicators">
          <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="0" class="active"
            aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#myCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
        </div>
      </div>

    </div>

  </div>
</div>
