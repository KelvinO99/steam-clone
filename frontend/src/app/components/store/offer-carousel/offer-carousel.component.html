<div class="container py-3 my-3 d-block">
    <div class="d-flex flex-column">

        <div class="container p-0">
            <div class="d-flex flex-wrap">
                <div class="col">

                </div>

                <div class="col-11 p-0">
                    <p class="titles"> special offer </p>
                </div>

                <div class="col">

                </div>
            </div>

        </div>

        <div id="offerCarousel" class="carousel carousel-fade main" data-bs-ride="carousel">
            <div class="container p-0">
                <div class="d-flex flex-wrap justify-content-center">

                    <div class="col p-0">

                        <button class="carousel-control-prev m-auto" type="button" data-bs-target="#offerCarousel"
                            data-bs-slide="prev" (click)="prevPage()">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>

                    </div>

                    <div class="col-11 d-flex justify-content-center px-0">
                        <div class="carousel-inner">

                            <div class="carousel-item" *ngFor="let page of pages; let i = index"
                                [class.active]="currentIndex === i">
                                <div class="container p-0">
                                    <div class="d-flex flex-wrap">

                                        <div class="col-4 pe-1 pb-2" *ngFor="let card of getCardsForPage(i)"
                                            (click)="goTo('../game/' + card.id)">
                                            <div class="card">
                                                <img class="img" [src]="card?.images[0]?.image_path">

                                                <div class="container text py-2">
                                                    <div class="d-flex flex-wrap">
            
                                                        <div class="col d-flex">
                                                            <div class="discountPercentage px-2">
                                                                <span class="discountPercentage"> {{ card?.discounted_percentage }}% </span>
                                                            </div>
                                                            <div class="price px-2">
                                                                <div class="col d-flex justify-content-end">
                                                                    <span class="basePrice"> {{ card?.base_price.toFixed(2) + "€" }} </span>
                                                                </div>
                                                                <div class="col d-flex justify-content-end">
                                                                    <span class="discountPrice"> {{ card?.discounted_price.toFixed(2) + "€" }}
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
    
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                
                            </div>
                        </div>
                    </div>

                    <div class="col p-0">

                        <button class="carousel-control-next align-items-center m-auto" type="button"
                            data-bs-target="#offerCarousel" data-bs-slide="next" (click)="nextPage()">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>

                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
