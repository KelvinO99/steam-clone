<div class="container py-3 my-3 d-block game-tb-container">
  <div class="d-flex flex-wrap">
    <div class="col p-0">

    </div>

    <div class="col-11 p-0">
      <button class="button-label px-3 py-2 mb-4" *ngFor="let item of tags" (click)="loadData(item.id)"> {{item.name}} </button>
      <div class="container p-0">
        <div class="d-flex flex-row">
          <div class="col-8">
              
            <mat-card class="p-0" *ngFor="let item of games?.games" (click)="goTo('../game/' + item.id)"> <!-- (mouseenter)="setHoveredGameId(item.id)" (mouseleave)="resetHoveredGameId()" -->
              <div class="container p-0">
                <mat-card-content class="mb-2">
                  <div class="container mat-card-content-container p-0">
                    <div class="d-flex flex-wrap">
                
                      <div class="col-3 pe-2">
                        <img [src]="item.images[0]?.image_path" class="image">
                      </div>
                
                      <div class="col-5 m-auto p-0">
                
                        <div class="container p-0">
                          <div class="d-flex flex-wrap">
                            <div class="col-12 p-0">
                              <span class="title"> {{item.name}} </span>
                            </div>
                          </div>
                        </div>
                
                        <div class="container p-0">
                          <div class="d-flex flex-wrap">
                            <div class="col-12 p-0">
                              <span>
                                <img src="https://store.cloudflare.steamstatic.com/public/images/v6/icon_platform_win.png?v=3"
                                  class="opacity img-fluid">
                              </span>
                            </div>
                          </div>
                        </div>
                
                        <div class="container p-0">
                          <div class="d-flex flex-wrap">
                            <div class="col-12 p-0">
                              <span class="tags" *ngFor="let tag of item.games_tags.slice(0, 2); let last = last">
                                {{tag.tags.name}}{{last ? '' : ', '}}
                              </span>
                
                            </div>
                          </div>
                        </div>
                
                      </div>
                
                      <div class="col-2 p-0 d-flex justify-content-end m-auto">
                        <div class="discountPercentage" *ngIf="item.discounted_percentage != null && item.discounted_percentage > 0">
                          {{item.discounted_percentage}}%</div>
                      </div>
                
                      <div class="col-2 d-flex m-auto justify-content-center price">
                        <span class="free" *ngIf="item.base_price == 0 || item.base_price == null"> Free to Play</span>
                        <div>
                          <div class="d-flex justify-content-end">
                            <span class="basePriceDiscount" *ngIf="item.discounted_price != null && item.discounted_price > 0 &&  item.base_price > 0 && item.base_price != null">
                              {{item.base_price.toFixed(2) + "€"}}
                            </span>
                          </div>
                          <div>
                            <span class="discount" *ngIf="item.discounted_price != null && item.discounted_price > 0">{{item.discounted_price.toFixed(2)
                              + "€"}}</span>
                            <span class="basePrice"
                              *ngIf="item.discounted_price == null && item.base_price > 0 ">{{item.base_price.toFixed(2) +
                              "€"}}</span>
                          </div>
                        </div>
                      </div>
                
                    </div>
                  </div>
                </mat-card-content>
              </div>
            </mat-card>
          </div>

        </div>
      </div>

    </div>

  </div>
