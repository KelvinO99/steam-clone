<ng-template *ngIf="count == 0; then ifBlock else elseBlock "></ng-template>

<!--form per inserire la email-->
<ng-template #ifBlock>
    <div class="container-fluid body m-0 p-0">
        <img src="" style="width: 100wh;">
        <div class="container-fluid formGroup">
            <form [formGroup]="registerForm">

                <div class="containerError" *ngIf="!showDivError">
                    <span class="text"
                        *ngIf="!showEmailError">
                        Please enter a valid email address.  <br> </span>
                    <span class="text" *ngIf="!showEmailConfirmError"> Please enter a confirm email address. </span>
                </div>


                <div class="titleContainer">
                    <span class="title"> create your account </span>
                </div>

                <div class="form-group">
                    <label class="email"> Email Address </label>
                    <input type="email" class="form-control" formControlName="email" required>
                </div>

                <div class="form-group">
                    <label class="confirmEmail"> Confirm your Address </label>
                    <input type="email" class="form-control" [formControl]="confirmEmail" required>
                </div>

                <div class="form-group">
                    <label class="country"> Country of Residence </label>
                    <select class="form-select-sm" aria-label=".form-select-sm example">
                        <option *ngFor="let city of country" [value]="city">{{ city }}</option>
                    </select>
                </div>

                <div class="emailButton">
                    <button type="submit" class="btn btn-primary" (click)="controlEmailForm()"> Continue
                    </button>
                </div>

                <div class="form-check">
                    <input type="checkbox" class="form-check-input">
                    <label class="form-check-label"> I am 13 years of age or older and agree to the terms of the
                        Steam Subscriber Agreement and the <br> Valve Privacy Policy. </label>
                </div>
            </form>
        </div>
    </div>
</ng-template>

<!--form per inserire la passowrd-->
<ng-template #elseBlock>
    <div class="container-fluid body m-0 p-0">
        <img src="" style="width: 100wh;">
        <div class="container-fluid formGroup">
            <form [formGroup]="registerForm">

                <div class="containerError">
                    <div>
                        <span class="text"> Please enter a valid email address. </span>
                    </div>
                </div>

                <div class="titleContainer">
                    <span class="title"> create your account </span>
                </div>

                <div class="form-group">
                    <label class="emailaddress"> Steam Account Name </label>
                    <input type="username" class="form-control" formControlName="username" required>
                </div>

                <div class="form-group">
                    <label class="choosepassword"> Choose Password </label>
                    <input type="password" class="form-control" formControlName="password"
                        autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label class="confirmpassword"> Confirm Password </label>
                    <input type="password" class="form-control" id="confirmPassword" autocomplete="off" required>
                </div>

                <div class="signUp">
                    <button type="submit" class="btn btn-primary" (click)="registerUser()"> Done
                    </button>
                    <!-- <button type="submit" class="btn btn-primary continue" (click)="controlPasswordForm()"
                        [disabled]="registerForm.controls['password'].invalid"> Done
                    </button> -->
                </div>
            </form>
        </div>
    </div>
</ng-template>
