<div class="container-fluid p-0 m-0">
    <div class="row">

        <div class="left">
        </div>

        <div class="contentCenter">
            <!-- Prima lista -->
            <ul class="firstList">
                <li class="nav-item">
                    <a class="nav-link menuItemUser installSteam" routerLink=""> <img
                            src="https://store.cloudflare.steamstatic.com/public/shared/images/header/btn_header_installsteam_download.png?v=1">
                        Install Steam </a>
                </li>

                <li class="nav-item" *ngIf="!loggedIn">
                    <a class="nav-link menuItemUser" routerLinkActive="active" routerLink="/login"> login </a>
                </li>

                <li class="nav-item" *ngIf="loggedIn">
                    <a class="nav-link menuItemUser" routerLinkActive="active"> {{ username}} </a>
                </li>

                <li class="nav-item" *ngIf="loggedIn == true">
                    <a class="nav-link menuItemUser" routerLinkActive="active" (click)="logout()"> logout </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link menuItemUser"> | </a>
                </li>

                <li class="nav-item">
                    <div class="dropdown p-0">
                        <a class="dropbtn nav-link menuItemUser"> Language </a>
                        <div class="dropdown-content language">
                            <a *ngFor="let item of language" class="subMenuItem"> {{ item }}
                            </a>
                        </div>
                    </div>
                </li>
            </ul>

            <!-- Seconda lista -->
            <ul class="secondList">
                <li class="nav-item">
                    <a class="nav-link menuItem p-0" href="#"> <img
                            src="https://store.cloudflare.steamstatic.com/public/shared/images/header/logo_steam.svg?t=962016"
                            height="44px" width="176px">
                    </a>
                </li>
                <li class="nav-item">
                    <div class="dropdown p-0">
                        <a class="dropbtn nav-link menuItem" routerLink="#"> Shop </a>
                        <div class="dropdown-content shop">
                            <a class="subMenuItem" routerLink=""> Main Page </a>
                            <a class="subMenuItem" routerLink="#"> Discovery Queue </a>
                            <a class="subMenuItem" routerLink="#"> Wishlist </a>
                            <a class="subMenuItem" routerLink="#"> Point Shop </a>
                            <a class="subMenuItem" routerLink="#"> News </a>
                            <a class="subMenuItem" routerLink="#"> Stats </a>
                            <a class="subMenuItem" routerLink="#"> About </a>
                        </div>
                    </div>
                </li>
                <li class="nav-item">
                    <div class="dropdown">
                        <a class="dropbtn nav-link menuItem" routerLink="#"> Community </a>
                        <div class="dropdown-content community">
                            <a class="subMenuItem" routerLink="#"> Home </a>
                            <a class="subMenuItem" routerLink="#"> Discussion </a>
                            <a class="subMenuItem" routerLink="#"> WorkShop </a>
                            <a class="subMenuItem" routerLink="#"> Market </a>
                            <a class="subMenuItem" routerLink="#"> Broadcast </a>
                        </div>
                    </div>
                </li>
                <li class="nav-item">
                    <a class="nav-link menuItem" routerLink="#"> About </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link menuItem" routerLink="#"> Support </a>
                </li>
            </ul>
        </div>

        <div class="right">
        </div>

    </div>
</div>
