<!--Edit del Titolo-->
<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form (ngSubmit)="updateGame()" [formGroup]="gameForm">
                <p> <label for="gameName">Nome del gioco:</label></p>
                <p> <input type="text" id="gameName" [(ngModel)]="game?.game.name" formControlName="name"> </p>
            
                <p> <button type="submit">Aggiorna</button> </p>
            </form>
        </div>
    </div>
</div>
